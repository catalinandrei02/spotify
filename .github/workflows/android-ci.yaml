name: Android CI

on:
    push:
        branches: [ master ]
    pull_request:
        branches: [ master ]

jobs:
    lint:
        name: Run Android Lint Checks
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up JDK 17
              uses: actions/setup-java@v3
              with:
                  java-version: 17
                  distribution: 'temurin'

            - name: Setup Android SDK
              uses: android-actions/setup-android@v2

            - name: Cache Gradle dependencies
              uses: actions/cache@v3
              with:
                  path: |
                      ~/.gradle/caches
                      ~/.gradle/wrapper
                  key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
                  restore-keys: |
                      ${{ runner.os }}-gradle-

            - name: Run Android Lint
              run: ./gradlew lint

    spotless:
        name: Run Spotless Formatting Check
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up JDK 17
              uses: actions/setup-java@v3
              with:
                  java-version: 17
                  distribution: 'temurin'

            - name: Setup Android SDK
              uses: android-actions/setup-android@v2

            - name: Run Spotless Checks
              run: ./gradlew spotlessCheck

    test:
        name: Run Unit Tests
        runs-on: ubuntu-latest
        continue-on-error: true
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up JDK 17
              uses: actions/setup-java@v3
              with:
                  java-version: 17
                  distribution: 'temurin'

            - name: Setup Android SDK
              uses: android-actions/setup-android@v2

            - name: Run Unit Tests
              run: ./gradlew test

    build_apk:
        name: Build Debug APK
        runs-on: ubuntu-latest
        needs: [lint, spotless, test]  # Only run if previous jobs succeed
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up JDK 17
              uses: actions/setup-java@v3
              with:
                  java-version: 17
                  distribution: 'temurin'

            - name: Setup Android SDK
              uses: android-actions/setup-android@v2

            - name: Build Debug APK
              run: ./gradlew assembleDebug
